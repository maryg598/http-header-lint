[project]
name = "headerlint"
version = "0.1.0"
description = "Lint raw HTTP header blocks and report findings with line numbers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "maryg598" }]

[project.scripts]
headerlint = "headerlint.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["headerlint*"]
